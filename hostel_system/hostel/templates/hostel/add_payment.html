{% extends "hostel/base.html" %}

{% block title %}Record Payment{% endblock %}

{% block content %}
    <a class="back-link" href="{% url 'payments' %}"><svg class="icon"><use href="#i-arrow-left"/></svg> Back to payments</a>
    <div class="page-header"><h1>Record Payment</h1></div>

    <form method="post" class="card form-card">
        {% csrf_token %}
        {% include "hostel/_form_fields.html" %}
        <div class="form-actions">
            <button type="submit" class="btn">Save Payment</button>
            <a href="{% url 'payments' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
