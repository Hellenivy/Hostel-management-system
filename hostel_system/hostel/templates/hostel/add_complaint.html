<!DOCTYPE html>
<html>
<head>
    <title>Add Complaint</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; }
        h1 { color: #2c3e50; }
        form { background: white; padding: 20px; max-width: 400px; border: 1px solid #ddd; }
        button { background: #2c3e50; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Add Complaint</h1>
    <p><a href="{% url 'complaints' %}">Back to Complaints</a></p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Complaint</button>
    </form>
</body>
</html>
