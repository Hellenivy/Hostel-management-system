{% extends "hostel/base.html" %}

{% block title %}Log in{% endblock %}

{% block body %}
    <div class="auth">
        <form method="post" class="card auth-card">
            {% csrf_token %}
            <div class="brand-mark"><svg class="icon"><use href="#i-bed"/></svg></div>
            <h1>Welcome back</h1>
            <p class="page-subtitle">Log in to manage rooms, tenants and payments.</p>
            {% include "hostel/_form_fields.html" %}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn">Log in</button>
            <p class="subtle" style="margin-top: 14px; text-align: center;">New student? <a href="{% url 'register' %}">Create an account</a></p>
        </form>
    </div>
{% endblock %}
